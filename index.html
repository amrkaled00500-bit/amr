<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMB - المهندس عمرو خالد عمارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#f8fafc}
.page{display:none}
.page.active{display:block}
.header{background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;padding:25px 20px;text-align:center}
.logo{width:65px;height:65px;background:#fff;color:#2563eb;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;margin:0 auto 12px}
.privacy{background:#fef3c7;border:2px solid #f59e0b;color:#92400e;padding:10px;border-radius:8px;margin:15px;font-size:13px;text-align:center;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:20px;max-width:700px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:15px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.1);cursor:pointer}
.card-green{background:#10b981!important;color:#fff!important}
.card h3{font-size:14px;margin:8px 0;font-weight:700}
.card-icon{font-size:32px;margin-bottom:8px}
.form-container{max-width:600px;margin:20px auto;padding:20px}
.form-group{margin-bottom:15px}
label{display:block;font-weight:700;margin-bottom:5px;font-size:14px}
input,select,textarea{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:8px;font-family:'Cairo';font-size:14px}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer;margin-top:10px}
.btn-green{background:#10b981;color:#fff}
.btn-discount{background:#f1f5f9;color:#475569;border:2px dashed #cbd5e1}
.btn-discount.active{background:#10b981;color:#fff;border:none}
.discount-input{display:none;margin-top:10px}
.discount-input.show{display:block}
.back-btn{color:#2563eb;background:#eff6ff;padding:10px;border-radius:8px;margin-bottom:15px;display:inline-block;cursor:pointer}
.whatsapp{position:fixed;bottom:20px;left:20px;width:60px;height:60px;background:#10b981;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;box-shadow:0 4px 12px rgba(16,185,129,0.4)}
</style>
</head>
<body>

<!-- الصفحة الرئيسية -->
<div id="home" class="page active">
  <div class="header">
    <div class="logo">AMB</div>
    <h1>المهندس عمرو خالد عمارة</h1>
    <p>لصيانة الثلاجات والغسالات فقط</p>
  </div>

  <div class="privacy">🔒 أمان وخصوصية: بياناتك لا تُحفظ على أي سيرفر - تُرسل مباشرة عبر واتساب للمهندس عمرو فقط</div>

  <div class="cards">
    <div class="card" onclick="showPage('washing')">
      <div class="card-icon">🧺</div>
      <h3>صيانة غسالات</h3>
    </div>
    <div class="card card-green" onclick="window.location.href='tel:01201637344'">
      <div class="card-icon">📞</div>
      <h3>اتصال مباشر</h3>
    </div>
    <div class="card" onclick="showPage('fridge')">
      <div class="card-icon">❄️</div>
      <h3>صيانة تلاجات</h3>
    </div>
  </div>

  <div class="whatsapp" onclick="window.open('https://wa.me/201201637344')">💬</div>
</div>

<!-- فورم الغسالة -->
<div id="washing" class="page">
  <div class="form-container">
    <div class="back-btn" onclick="showPage('home')">← رجوع</div>
    <h2 style="color:#2563eb;margin-bottom:20px">تسجيل طلب صيانة غسالة</h2>

    <div class="form-group">
      <label>الاسم</label>
      <input type="text" id="w-name" placeholder="الاسم الكامل">
    </div>

    <div class="form-group">
      <label>الموبايل</label>
      <input type="tel" id="w-phone" placeholder="01xxxxxxxxx">
    </div>

    <div class="form-group">
      <label>نوع الغسالة</label>
      <select id="w-type">
        <option>غسالة أوتوماتيك</option>
        <option>فوق أوتوماتيك</option>
        <option>نص أوتوماتيك</option>
      </select>
    </div>

    <div class="form-group">
      <label>وصف العطل</label>
      <textarea id="w-issue" rows="3" placeholder="صوت عالي - مش بتعصر"></textarea>
    </div>

    <div class="form-group">
      <label>العنوان</label>
      <input type="text" id="w-address" placeholder="شبين الكوم">
    </div>

    <button class="btn btn-discount" id="w-discount-btn" onclick="toggleDiscount('w')">🎁 عندك كود خصم؟</button>
    <div class="discount-input" id="w-discount-input">
      <input type="text" id="w-discount-code" placeholder="اكتب كود الخصم">
      <button class="btn btn-green" style="margin-top:8px" onclick="applyDiscount('w')">تفعيل الخصم</button>
    </div>

    <button class="btn btn-green" onclick="submitForm('washing')">إرسال الطلب</button>
  </div>
</div>

<!-- فورم التلاجة -->
<div id="fridge" class="page">
  <div class="form-container">
    <div class="back-btn" onclick="showPage('home')">← رجوع</div>
    <h2 style="color:#2563eb;margin-bottom:20px">تسجيل طلب صيانة ثلاجة</h2>

    <div class="form-group">
      <label>الاسم</label>
      <input type="text" id="f-name" placeholder="الاسم الكامل">
    </div>

    <div class="form-group">
      <label>الموبايل</label>
      <input type="tel" id="f-phone" placeholder="01xxxxxxxxx">
    </div>

    <div class="form-group">
      <label>نوع الثلاجة</label>
      <select id="f-type">
        <option>ثلاجة باب واحد</option>
        <option>ثلاجة بابين</option>
        <option>نوفروست</option>
        <option>ديب فريزر أفقي</option>
        <option>ديب فريزر رأسي</option>
      </select>
    </div>

    <div class="form-group">
      <label>وصف العطل</label>
      <textarea id="f-issue" rows="3" placeholder="التبريد ضعيف - بتنزل مياه - بتعمل تلج كتير"></textarea>
    </div>

    <div class="form-group">
      <label>العنوان</label>
      <input type="text" id="f-address" placeholder="شبين الكوم">
    </div>

    <button class="btn btn-discount" id="f-discount-btn" onclick="toggleDiscount('f')">🎁 عندك كود خصم؟</button>
    <div class="discount-input" id="f-discount-input">
      <input type="text" id="f-discount-code" placeholder="اكتب كود الخصم">
      <button class="btn btn-green" style="margin-top:8px" onclick="applyDiscount('f')">تفعيل الخصم</button>
    </div>

    <button class="btn btn-green" onclick="submitForm('fridge')">إرسال الطلب</button>
  </div>
</div>

<script>
let discountApplied = {w:false, f:false};

function showPage(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(page).classList.add('active');
}

function toggleDiscount(type){
  document.getElementById(type+'-discount-input').classList.toggle('show');
}

function applyDiscount(type){
  const code = document.getElementById(type+'-discount-code').value;
  if(code){
    discountApplied[type] = true;
    const btn = document.getElementById(type+'-discount-btn');
    btn.classList.add('active');
    btn.innerHTML = '✅ تم تفعيل خصم 10%';
    document.getElementById(type+'-discount-input').classList.remove('show');
  }
}

function submitForm(type){
  const prefix = type === 'washing'? 'w' : 'f';
  const name = document.getElementById(prefix+'-name').value;
  const phone = document.getElementById(prefix+'-phone').value;
  const dtype = document.getElementById(prefix+'-type').value;
  const issue = document.getElementById(prefix+'-issue').value;
  const address = document.getElementById(prefix+'-address').value;

  if(!name ||!phone){
    alert('من فضلك املأ الاسم والموبايل');
    return;
  }

  const serviceType = type === 'washing'? 'صيانة الغسالة' : 'صيانة الثلاجة';
  let msg = `*طلب ${serviceType}*\n\n`;
  msg += `الاسم: ${name}\n`;
  msg += `الموبايل: ${phone}\n`;
  msg += `النوع: ${dtype}\n`;
  msg += `العطل: ${issue}\n`;
  msg += `العنوان: ${address}\n`;
  if(discountApplied[prefix]){
    msg += `\n🎁 خصم 10% مفعل\n`;
  }
  msg += `\n🔒 بيانات العميل محمية - وصلت للمهندس عمرو فقط`;

  window.open(`https://wa.me/201201637344?text=${encodeURIComponent(msg)}`);
  showPage('home');
  alert('✅ تم الإرسال بنجاح');
}
</script>

</body>
</html>
