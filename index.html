<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AMB - المهندس عمرو خالد عمارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:linear-gradient(180deg,#0a0e27 0%,#0f172a 50%,#1a2332 100%);min-height:100vh;color:#fff;padding:0 15px 40px}
.container{max-width:480px;margin:0 auto;padding-top:30px}

.logo-box{width:100%;max-width:280px;height:140px;margin:0 auto 25px;position:relative}
.logo-border{position:absolute;top:0;left:0;width:100%;height:100%;border:4px solid #0ea5e9;border-radius:20px;box-shadow:0 0 30px rgba(14,165,233,0.6),inset 0 0 20px rgba(14,165,233,0.2)}
.logo-border::before{content:'';position:absolute;top:-4px;left:-4px;width:30px;height:100%;border-left:4px solid #0ea5e9;border-top:4px solid #0ea5e9;border-bottom:4px solid #0ea5e9;border-radius:20px 0 0 20px}
.logo-content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:900;letter-spacing:5px;color:#fff;text-shadow:0 0 20px rgba(14,165,233,0.8)}

.title{text-align:center;margin-bottom:8px}
.title h1{font-size:28px;font-weight:900;margin-bottom:8px}
.title p{color:#0ea5e9;font-size:18px;font-weight:700}

.card{background:rgba(30,41,59,0.6);backdrop-filter:blur(10px);border:2px solid rgba(71,85,105,0.3);border-radius:20px;margin:20px 0;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:15px;transition:0.3s}
.card:hover{border-color:#0ea5e9;box-shadow:0 8px 25px rgba(14,165,233,0.3);transform:translateY(-3px)}
.card-content{flex:1;text-align:right}
.card-content h3{font-size:20px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.card-content h3 .dot{width:10px;height:10px;background:#0ea5e9;border-radius:50%;box-shadow:0 0 10px #0ea5e9}
.card-content p{color:#94a3b8;font-size:14px;font-weight:600;line-height:1.6}
.card-img{width:100px;height:100px;border-radius:15px;object-fit:cover;box-shadow:0 5px 20px rgba(0,0,0,0.4)}
.card-img.phone{width:80px;height:80px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 0 30px rgba(16,185,129,0.5)}
.card-img.phone i{font-size:40px;color:#fff;transform:rotate(15deg)}

.contact-card .card-content h3 .dot{background:#10b981;box-shadow:0 0 10px #10b981}
.contact-card .phone-num{color:#10b981;font-size:24px;font-weight:900;letter-spacing:3px;margin-top:8px}

.whatsapp-btn{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);width:90%;max-width:440px;padding:18px;background:linear-gradient(135deg,#25d366,#20ba5a);color:#fff;border:none;border-radius:50px;font-size:18px;font-weight:900;cursor:pointer;font-family:'Cairo';box-shadow:0 8px 30px rgba(37,211,102,0.5);display:flex;align-items:center;justify-content:center;gap:10px;z-index:999;text-decoration:none;transition:0.3s}
.whatsapp-btn:hover{transform:translateX(-50%) translateY(-3px);box-shadow:0 12px 40px rgba(37,211,102,0.6)}
.whatsapp-btn i{font-size:24px}

.spacer{height:100px}

@media(max-width:480px){
  .logo-content{font-size:42px}
  .title h1{font-size:24px}
  .title p{font-size:16px}
  .card{padding:18px}
  .card-content h3{font-size:18px}
  .card-img{width:85px;height:85px}
}
</style>
</head>
<body>

<div class="container">

  <!-- اللوجو -->
  <div class="logo-box">
    <div class="logo-border"></div>
    <div class="logo-content">AMB</div>
  </div>

  <!-- العنوان -->
  <div class="title">
    <h1>المهندس عمرو خالد عمارة</h1>
    <p>لصيانة الثلاجات والغسالات فقط</p>
  </div>

  <!-- كارت صيانة تلاجات -->
  <div class="card">
    <div class="card-content">
      <h3><span class="dot"></span> صيانة تلاجات</h3>
      <p>نوفروست، ديفروست، سايد باي سايد</p>
    </div>
    <img src="https://images.unsplash.com/photo-1571175443880-49e1d25b2bc5?w=400&q=80" alt="تلاجة" class="card-img">
  </div>

  <!-- كارت صيانة غسالات -->
  <div class="card">
    <div class="card-content">
      <h3><span class="dot"></span> صيانة غسالات</h3>
      <p>أوتوماتيك، فوق أوتوماتيك، أطباق</p>
    </div>
    <img src="https://images.unsplash.com/photo-1626806787461-102c1bfaaea1?w=400&q=80" alt="غسالة" class="card-img">
  </div>

  <!-- كارت اتصال مباشر -->
  <div class="card contact-card">
    <div class="card-content">
      <h3><span class="dot"></span> اتصال مباشر</h3>
      <div class="phone-num">0120 163 7344</div>
    </div>
    <div class="card-img phone">
      <i class="fas fa-phone"></i>
    </div>
  </div>

  <div class="spacer"></div>

</div>

<!-- زرار واتساب ثابت -->
<a href="https://wa.me/201201637344?text=السلام عليكم، محتاج استفسر عن الصيانة" class="whatsapp-btn">
  <i class="fab fa-whatsapp"></i>
  استفسار عبر واتساب
</a>

</body>
</html>
